<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#f5f5f7" />
<meta name="color-scheme" content="light" />
<title>Koda Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css" />
<link rel="stylesheet" href="assets/ota.css" />
<link rel="stylesheet" href="assets/products.css" />
</head>
<body>
<div class="auth-shell" id="authShell">
  <div class="login-wrap">
    <div class="login-brand"><div class="brandmark large">K</div><span>Koda</span></div>
    <div class="login-card">
      <div class="eyebrow">KODA ADMIN</div>
      <h1>Bem-vindo.</h1>
      <p>Entre com uma conta administrativa da Koda.</p>
      <form id="loginForm" class="login-form">
        <label>E-mail<input id="loginEmail" name="email" type="email" autocomplete="username" required placeholder="voce@koda.com" /></label>
        <label>Senha<input id="loginPassword" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" /></label>
        <button class="primary login-submit" id="loginSubmit" type="submit">Entrar</button>
        <div class="form-status" id="loginStatus" role="status" aria-live="polite"></div>
      </form>
    </div>
    <p class="login-foot">Acesso restrito · Koda</p>
  </div>
</div>

<div class="app" id="adminApp" hidden>
<aside class="sidebar">
  <div class="brand"><div class="brandmark">K</div><div class="brandtext"><strong>Koda</strong><span>Admin</span></div></div>
  <nav id="nav">
    <button class="navbtn active" data-page="dashboard"><span class="glyph">⌂</span><span>Visão geral</span></button>
    <button class="navbtn" data-page="devices"><span class="glyph">◫</span><span>Dispositivos</span></button>
    <button class="navbtn" data-page="os"><span class="glyph">↻</span><span>KODA OS</span></button>
    <button class="navbtn" data-page="orders"><span class="glyph">▣</span><span>Pedidos</span></button>
    <button class="navbtn" data-page="customers"><span class="glyph">◎</span><span>Clientes</span></button>
    <button class="navbtn" data-page="products"><span class="glyph">◇</span><span>Produtos</span></button>
    <button class="navbtn" data-page="cloud"><span class="glyph">☁</span><span>KodaCloud</span></button>
    <button class="navbtn" data-page="support"><span class="glyph">?</span><span>Chamados</span></button>
    <button class="navbtn" data-page="audit"><span class="glyph">≡</span><span>Auditoria</span></button>
    <button class="navbtn" data-page="settings"><span class="glyph">⚙</span><span>Configurações</span></button>
  </nav>
  <div class="spacer"></div>
  <div class="sys" id="systemStatus"><strong><i class="dot"></i>KodaCloud</strong><span>Conectando…</span></div>
</aside>
<main class="main">
<header class="topbar">
  <div class="crumb" id="crumb">Visão geral</div>
  <div class="actions">
    <button class="top-action" id="refreshData" type="button">Atualizar</button>
    <button class="round" id="search" type="button" aria-label="Busca">⌕</button>
    <button class="avatar" id="accountButton" type="button" aria-label="Conta">K</button>
    <div class="account-menu" id="accountMenu" hidden>
      <strong id="accountName">Administrador</strong>
      <span id="accountEmail"></span>
      <button id="logoutButton" type="button">Sair</button>
    </div>
  </div>
</header>
<section class="page active" id="page-dashboard">
  <div class="loading-state">Carregando dados reais do KodaCloud…</div>
</section>
<section class="page" id="page-devices"></section>
<section class="page" id="page-os"></section>
<section class="page" id="page-orders"></section>
<section class="page" id="page-customers"></section>
<section class="page" id="page-products"></section>
<section class="page" id="page-cloud"></section>
<section class="page" id="page-support"></section>
<section class="page" id="page-audit"></section>
<section class="page" id="page-settings"></section>
</main>
</div>

<div class="modal" id="modal" hidden>
  <div class="dialog">
    <button class="round modal-close" id="close" type="button">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script type="module" src="assets/app.js"></script>
<script type="module" src="assets/ota.js"></script>
<script type="module" src="assets/products.js"></script>
</body>
</html>
